<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Syncrodyson · Eventos</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f3f3;
            color: #202723;
            margin: 0;
            padding: 16px;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin: 0 auto 16px;
            max-width: 133mm;
        }
        button {
            background: white;
            border: 1px solid #333;
            padding: 8px 12px;
            cursor: pointer;
        }
        .toolbar small { font-size: 12px; line-height: 1.4; }
        .sheet {
            display: grid;
            grid-template-columns: repeat(4, 41mm);
            gap: 0;
            justify-content: center;
        }
        .card {
            width: 41mm;
            height: 63mm;
            background: white;
            border: 1px solid #222;
            border-radius: 1.8mm;
            padding: 2.2mm;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            break-inside: avoid;
        }
        .card[hidden] { display: none !important; }
        .heading {
            display: flex;
            align-items: center;
            gap: 1mm;
            border-bottom: 1px solid #888;
            padding-bottom: 1mm;
            min-height: 9mm;
            flex-shrink: 0;
        }
        .heading img { width: 5mm; height: 5mm; object-fit: contain; }
        h2 { font-size: 8pt; line-height: 1.12; margin: 0; }
        .event-half {
            padding-top: 2mm;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .event-effect { font-size: 7.5pt; line-height: 1.28; margin: 2mm 0 0; }
        .event-effect img {
            width: 4mm;
            height: 4mm;
            object-fit: contain;
            vertical-align: middle;
        }
        .initial-rule {
            margin: 1mm 0 0;
            font-size: 5.5pt;
            line-height: 1.05;
            text-align: center;
            flex: none;
        }
        .standalone-text {
            flex: 1;
            min-height: 0;
            font-size: 7pt;
            line-height: 1.2;
            overflow: hidden;
        }
        .standalone-text p { margin: 1.2mm 0; }
        .standalone-text img {
            width: 3.5mm;
            height: 3.5mm;
            object-fit: contain;
            vertical-align: middle;
        }
        .quadrant-instruction {
            font-size: 6pt;
            font-weight: 700;
            line-height: 1.15;
            display: block;
            margin: 0 0 2mm;
        }
        .card-foot {
            display: flex;
            justify-content: space-between;
            font-size: 5pt;
            letter-spacing: .06em;
            color: #59645f;
            margin-top: 1mm;
        }
        .overflow-details { width: 100%; font-size: 12px; line-height: 1.4; }
        .overflow-details summary { cursor: pointer; }
        .overflow-details ul { margin: 6px 0; padding-left: 20px; }
        .print-page { display: contents; }
        @page { size: A4 portrait; margin: 8mm; }
        @media screen and (max-width: 760px) {
            .sheet { grid-template-columns: repeat(3, 41mm); }
        }
        @media screen and (max-width: 510px) {
            .sheet { grid-template-columns: repeat(2, 41mm); }
        }
        @media print {
            html, body { margin: 0; padding: 0; background: white; }
            .toolbar { display: none; }
            .sheet {
                display: block;
                width: 100%;
                margin: 0;
                padding: 0;
                text-align: center;
                font-size: 0;
            }
            .print-page {
                display: grid;
                width: 100%;
                height: 281mm;
                grid-template-columns: repeat(4, 41mm);
                grid-auto-rows: 63mm;
                gap: 0;
                justify-content: center;
                align-content: center;
                padding: 0;
                break-inside: avoid;
                page-break-inside: avoid;
                break-after: page;
                page-break-after: always;
            }
            .print-page:last-child { break-after: auto; page-break-after: auto; }
            .print-page > .card {
                display: inline-flex;
                position: relative;
                top: 0;
                vertical-align: top;
                width: 41mm;
                height: 63mm;
                margin: 0;
                font-size: 16px;
                text-align: left;
                break-inside: avoid;
                page-break-inside: avoid;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <button type="button" onclick="window.print()">Imprimir / guardar PDF</button>
        <small>Cartas de 41 × 63 mm · <span id="summary"></span><br>Eventos con efectos e iconos.</small>
        <details class="overflow-details" id="overflow-details" hidden><summary id="overflow-summary"></summary><ul id="overflow-list"></ul></details>
    </div>
    <main class="sheet" id="sheet" aria-label="Cartas de evento"></main>
    <script>
        const cards = [
            { id: 'E01', title: 'Reconocimiento público', effect: 'Coloca esta carta en el cuadrante indicado en su reverso del mazo. El primer jugador que coloque un disco en la capa Estructura [ES] de ese cuadrante reclama esta carta y gana 5 [PI].' },
            { id: 'E02', title: 'Reconocimiento público', effect: 'Coloca esta carta en el cuadrante indicado en su reverso del mazo. El primer jugador que coloque un disco en la capa Fotovoltaica [FV] de ese cuadrante reclama esta carta y gana 5 [PI].' },
            { id: 'E03', title: 'Reconocimiento público', effect: 'Coloca esta carta en el cuadrante indicado en su reverso del mazo. El primer jugador que coloque un disco en la capa Transmisión [TS] de ese cuadrante reclama esta carta y gana 5 [PI].' },
            { id: 'E04', title: 'Reconocimiento público', effect: 'Coloca esta carta en el cuadrante indicado en su reverso del mazo. El primer jugador que coloque un disco en la capa Refrigeración [RF] de ese cuadrante reclama esta carta y gana 5 [PI].' },
            { id: 'E05', title: 'Producción estable', effect: 'Cada jugador aumenta en 1 [PE] su producción de energía por cada sector con todas sus capas ocupadas por discos, en el que tenga al menos un disco propio. Si aparece entre los eventos iniciales, descarta esta carta sin aplicar sus efectos y saca otra.' },
            { id: "E16", title: "Lluvia de voluntarios", effect: "Coloca esta carta en el cuadrante indicado en su reverso del mazo. Cuando vayas a colocar un ingeniero anclado [AI] en este cuadrante, colócalo en esta carta en su lugar. De uno en uno. Cuando haya 4 ingenieros en esta carta, descártala inmediatamente y devuelve los 4 ingenieros a sus reservas." }
        ];

        function icon(file) { return `<img src="./iconos/${file}.svg" alt="">` }
        const effectIcons = {
            QD: ['QD-quitar-disco', 'Quitar disco'],
            PI: ['PI-puntos-inmediatos', 'Puntos inmediatos'],
            PE: ['PE-produccion-energia', 'Producción de energía'],
            ES: ['ES-estructura', 'Estructura'],
            FV: ['FV-fotovoltaico', 'Fotovoltaica'],
            TS: ['TS-transmision', 'Transmisión'],
            RF: ['RF-refrigeracion', 'Refrigeración'],
            MO: ['MO-microondas', 'Microondas'],
            AI: ['AI-ingeniero-anclado', 'Ingeniero anclado']
        };
        function renderEffect(text) {
            const common = "Coloca esta carta en el cuadrante indicado en su reverso del mazo.";
            if (text.startsWith(common)) return '<span class="quadrant-instruction">' + common + '</span>' + renderEffect(text.slice(common.length).trimStart());
            return text.split(/(\[[A-Z]{2}\])/gi).map(part => {
                const entry = effectIcons[part.slice(1, -1).toUpperCase()];
                return part.startsWith('[') && entry ? `<img src="./iconos/${entry[0]}.svg" alt="${entry[1]}" title="${entry[1]}">` : part.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }).join('');
        }
        function footer(card) { return `<footer class="card-foot"><span>SYNCRODYSON</span><span>${card.id}</span></footer>` }
        function render(card) {
            if (Array.isArray(card.effect)) return `<article class="card standalone-event" aria-label="${card.id} · ${card.title}"><header class="heading">${icon('EV-evento')}<div><h2>${card.title}</h2></div></header><section class="standalone-text" aria-label="Efecto del evento">${card.effect.map(paragraph => `<p>${renderEffect(paragraph)}</p>`).join('')}</section>${footer(card)}</article>`;
            const initialWarning = 'Si aparece entre los eventos iniciales, descarta esta carta sin aplicar sus efectos y saca otra.';
            const hasInitialWarning = typeof card.effect === 'string' && card.effect.endsWith(initialWarning);
            const effect = hasInitialWarning ? card.effect.slice(0, -initialWarning.length).trimEnd() : card.effect;
            const initialNote = hasInitialWarning ? `<p class="initial-rule">${initialWarning}</p>` : '';
            return `<article class="card standalone-event" aria-label="${card.id} · ${card.title}"><header class="heading">${icon('EV-evento')}<div><h2>${card.title}</h2></div></header><section class="event-half"><p class="event-effect">${renderEffect(effect)}</p></section>${initialNote}${footer(card)}</article>`;
        }
        document.getElementById('sheet').innerHTML = cards.map(render).join('');
        function exceedsCardSize(card) {
            const rect = card.getBoundingClientRect(), style = getComputedStyle(card), tolerance = 1;
            const bottom = rect.bottom - parseFloat(style.borderBottomWidth) - parseFloat(style.paddingBottom);
            const right = rect.right - parseFloat(style.borderRightWidth) - parseFloat(style.paddingRight);
            const left = rect.left + parseFloat(style.borderLeftWidth) + parseFloat(style.paddingLeft);
            if (card.scrollHeight > card.clientHeight + tolerance || card.scrollWidth > card.clientWidth + tolerance) return true;
            return [...card.querySelectorAll('*')].some(element => {
                if (!(element instanceof HTMLElement)) return false;
                const bounds = element.getBoundingClientRect();
                if (!bounds.width || !bounds.height) return false;
                return bounds.bottom > bottom + tolerance || bounds.right > right + tolerance || bounds.left < left - tolerance
                    || (element.clientHeight > 0 && element.scrollHeight > element.clientHeight + tolerance)
                    || (element.clientWidth > 0 && element.scrollWidth > element.clientWidth + tolerance);
            });
        }
        function hideOversizedCards() {
            const elements = [...document.querySelectorAll('#sheet .card')];
            elements.forEach(card => { card.hidden = false; });
            const oversized = elements.filter(exceedsCardSize);
            oversized.forEach(card => { card.hidden = true; });
            const visible = elements.filter(card => !card.hidden);
            const hiddenOversized = oversized.filter(card => card.hidden);
            document.getElementById('summary').textContent = `${visible.length} cartas de evento visibles`;
            document.getElementById('overflow-details').hidden = hiddenOversized.length === 0;
            document.getElementById('overflow-summary').textContent = `${hiddenOversized.length} cartas ocultas porque exceden los 41 × 63 mm`;
            document.getElementById('overflow-list').replaceChildren(...hiddenOversized.map(card => {
                const item = document.createElement('li');
                item.textContent = card.getAttribute('aria-label');
                return item;
            }));
            const sheet = document.getElementById('sheet');
            const pages = [];
            for (let i = 0; i < visible.length; i += 16) {
                const page = document.createElement('section');
                page.className = 'print-page';
                page.append(...visible.slice(i, i + 16));
                pages.push(page);
            }
            sheet.replaceChildren(...pages, ...elements.filter(card => card.hidden));
            document.documentElement.dataset.overflowChecked = 'true';
        }
        // Medir con las fuentes y los iconos cargados también detecta texto recortado por overflow:hidden.
        Promise.all([
            document.fonts.ready,
            ...[...document.querySelectorAll('#sheet img')].map(img => img.decode().catch(() => {}))
        ]).then(hideOversizedCards);
    </script>
</body>

</html>
