<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syncrodyson · Reversos de eventos Mini USA</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;color:#202723;margin:0;padding:16px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:190mm;margin:0 auto 16px}
button{background:white;border:1px solid #333;padding:8px 12px;cursor:pointer}
.sheet{display:grid;grid-template-columns:repeat(4,41mm);gap:0mm;justify-content:center}
.card{width:41mm;height:63mm;background:#fff;border:0;border-radius:0;padding:2.2mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;break-inside:avoid;color:#111;position:relative}

.brand{font-size:7pt;letter-spacing:.13em;font-weight:bold;margin-top:6mm;text-align:center}
.die{width:18.4mm;height:18.4mm;border:0;display:grid;place-items:center;color:#111}
.die svg{width:18.4mm;height:18.4mm;display:block}.die rect{fill:#fff;stroke:#111;stroke-width:1.5}.die circle{fill:#111}
.caption{font-size:9pt;font-weight:800;letter-spacing:.04em;margin-bottom:6mm;text-align:center}
.print-page{display:contents}
@page{size:A4 portrait;margin:8mm}
@media print{
 html,body{margin:0;padding:0;background:#fff}
 .toolbar{display:none}
 .sheet{display:block;width:100%;margin:0;padding:0;text-align:center;font-size:0}
 .print-page{display:grid;grid-template-columns:repeat(4,41mm);grid-auto-rows:63mm;gap:0;justify-content:center;align-content:start;padding-top:4mm;break-inside:avoid;page-break-inside:avoid;break-after:page;page-break-after:always}
 .print-page:last-child{break-after:auto;page-break-after:auto}
 .print-page>.card{display:inline-flex;position:relative;top:0;vertical-align:top;width:41mm;height:63mm;margin:0;font-size:16px;text-align:left;break-inside:avoid;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (max-width:760px){.sheet{grid-template-columns:repeat(3,41mm)}}
@media screen and (max-width:510px){.sheet{grid-template-columns:repeat(2,41mm)}}
</style>
</head>
<body>
<div class="toolbar">
 <button onclick="window.print()">Imprimir reversos</button>
 <small>24 reversos · Mini USA 41 × 63 mm · 4 cartas por fila. Para impresión a doble cara, comprobar orientación y ajuste de la impresora.</small>
</div>
<main class="sheet" id="sheet" aria-label="Reversos de las cartas de evento"></main>
<script>
// Un reverso por cada carta de eventos.html, en el mismo orden.
// Se asignan los cuadrantes de forma cíclica con resultados de dado 1–4.
const ids=[
 'E01','E02','E03','E04','E06','E05','E16','E07','E08','E09','E10','E11','E12','E13','E14','E15',
 'E17','E18','E19','E20','E21','E22','E23','E24'
];
const backs=ids.map((id,i)=>{
 const number=(i%4)+1;
 const quadrant=['Alpha','Beta','Gamma','Delta'][number-1];
 const pips={1:[[0,0]],2:[[-7,-7],[7,7]],3:[[-7,-7],[0,0],[7,7]],4:[[-7,-7],[7,-7],[-7,7],[7,7]]}[number];
 const dieSvg=`<svg viewBox="-17 -17 34 34" role="img" aria-label="Dado ${number}"><rect x="-15" y="-15" width="30" height="30" rx="4"/>${pips.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.4"/>`).join('')}</svg>`;
 return `<article class="card" aria-label="Reverso ${id}, cuadrante ${quadrant}, dado ${number}"><div class="brand">SYNCRODYSON</div><div class="die" role="img" aria-label="Dado: ${number}">${dieSvg}</div><div class="caption">${quadrant}</div></article>`;
});
document.getElementById('sheet').innerHTML=Array.from({length:Math.ceil(backs.length/16)},(_,i)=>'<section class="print-page">'+backs.slice(i*16,i*16+16).join('')+'</section>').join('');
</script>
</body>
</html>
