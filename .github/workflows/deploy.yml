
name: Deploy a Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      
      
      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Puerto configurado: $SSH_PORT"

          echo "Probando conexión TCP..."
          if timeout 15 bash -c \
            'echo > /dev/tcp/$1/$2' _ "$SSH_HOST" "$SSH_PORT"; then
            echo "Conexión TCP exitosa"
          else
            echo "ERROR: No se puede conectar al servidor"
            exit 1
          fi

          echo "Obteniendo clave SSH..."
          if ssh-keyscan -T 15 -p "$SSH_PORT" \
            -H "$SSH_HOST" > ~/.ssh/known_hosts; then
            echo "Clave SSH obtenida"
          else
            echo "ERROR: ssh-keyscan falló"
            exit 1
          fi



      - name: Sincronizar archivos
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='**/.env' \
            --exclude='.env.*' \
            --exclude='**/.env.*' \
            -e "ssh -p $SSH_PORT -o IdentitiesOnly=yes" \
            ./ "$SSH_USER@$SSH_HOST:/home/u177553144/public_html/syncrodyson/"
