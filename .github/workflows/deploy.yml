
name: Deploy a Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      
      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ]; then
            echo "ERROR: SSH_HOST o SSH_PORT está vacío"
            exit 1
          fi

          echo "Obteniendo clave pública del servidor..."
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" \
            > ~/.ssh/known_hosts

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERROR: No se pudo obtener la clave SSH del servidor"
            exit 1
          fi


      - name: Sincronizar archivos
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='**/.env' \
            --exclude='.env.*' \
            --exclude='**/.env.*' \
            -e "ssh -p $SSH_PORT -o IdentitiesOnly=yes" \
            ./ "$SSH_USER@$SSH_HOST:/home/u177553144/public_html/syncrodyson/"
