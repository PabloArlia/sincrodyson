<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syncrodyson · Mercado</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202723;background:#e8e9e7;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;padding:18px}
.toolbar{width:min(100%,287mm);margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;letter-spacing:.06em}
button{border:0;border-radius:5px;background:#263a35;color:white;padding:10px 16px;font-weight:bold;cursor:pointer}
.board{width:287mm;height:200mm;margin:0 auto;background:#fafaf7;border:1.3mm solid #263238;border-radius:3mm;padding:3mm;display:grid;grid-template-rows:64mm 55mm minmax(0,1fr) 26mm;gap:2mm;box-shadow:0 3px 14px #0002}
.board-head{display:flex;align-items:center;gap:3mm;border-bottom:.45mm solid #263238;padding:0 1mm 1.5mm}
.brand{font-size:20pt;font-weight:900;letter-spacing:.13em;white-space:nowrap}
.brand-mark{display:inline-grid;place-items:center;width:8mm;height:8mm;border:1.1mm solid #263238;border-radius:50%;margin:0 .4mm;position:relative;font-size:0;vertical-align:middle}
.brand-mark:before{content:"";position:absolute;inset:-1.9mm;border:1mm dashed #263238;border-radius:50%}
.head-divider{height:7mm;border-left:.4mm solid #52605c}
.head-title{font-size:17pt;font-weight:800;letter-spacing:.08em}
.section{min-width:0;min-height:0;border:.45mm solid #35423e;border-radius:2mm;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.section-head{height:8mm;min-height:8mm;background:#28343a;color:#fff;display:flex;align-items:center;gap:2mm;padding:0 3mm;font-size:10pt;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.section-head img{height:5mm;width:5mm;object-fit:contain;filter:brightness(0) invert(1)}
.section-head img.project-head-icon{filter:none}
.common-grid{min-height:0;flex:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.rare-grid{min-height:0;flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.reagents .rare-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.mid-grid{min-height:0;display:grid;grid-template-columns:minmax(0,4.1fr) minmax(0,1.2fr) minmax(0,1.8fr);gap:2mm}
.mid-grid .section-head{font-size:9pt}
.transport{border-color:#277347}.transport .section-head{background:#277347}
.reagents{border-color:#a83131}.reagents .section-head{background:#a83131}
.rare-section{border-color:#514165}.rare-section .section-head{background:#514165}
.market-item{min-width:0;padding:1.5mm;display:grid;grid-template-rows:11mm 1fr;border-right:.25mm solid #d0d2ce}
.market-item:last-child{border-right:0}
.item-title{display:flex;align-items:center;justify-content:center;gap:1.2mm;border-bottom:.25mm solid #d0d2ce;font-weight:800;font-size:9pt;white-space:nowrap}
.item-title img{width:8mm;height:8mm;object-fit:contain;flex-shrink:0}
.item-name{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.item-name small{font-size:5.5pt;font-weight:600;color:#59615e;text-transform:uppercase;letter-spacing:.035em}
.reagents .item-title{gap:.6mm;font-size:8pt}
.reagents .item-title img{width:6mm;height:6mm}
.reagents .item-name{min-width:0}
.reagents .item-name small{font-size:4.6pt;white-space:normal;line-height:1.05}
.item-code{font-size:8pt}
.price-list{min-height:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:.5mm;padding-top:.8mm}
.price-row{min-height:0;display:grid;grid-template-columns:9mm minmax(0,1fr);align-items:center;gap:1mm;border-bottom:.2mm solid #ececea}
.price{font-size:10pt;font-weight:800;text-align:center;white-space:nowrap}
.slots{min-width:0;display:grid;grid-template-columns:repeat(var(--slots),5.6mm);gap:.8mm;align-content:center;justify-content:start}
.slot{width:5.6mm;height:5.6mm;border:.35mm solid #38423e;border-radius:1.2mm;background:linear-gradient(145deg,#fff,#fafbf9)}
.middle{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,4.1fr) minmax(0,1.2fr) minmax(0,1.8fr);gap:2mm}
.lower{min-height:0;display:grid;grid-template-columns:2fr 1.4fr 1.6fr;gap:2mm}
.staff-grid{min-height:0;flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.staff{min-width:0;padding:1.2mm;display:grid;grid-template-rows:10mm 6mm 1fr;justify-items:center;align-items:center;border-right:.25mm solid #d0d2ce}
.staff:last-child{border-right:0}
.staff img{width:8mm;height:9mm;object-fit:contain}
.staff-name{font-weight:800;font-size:8pt;white-space:nowrap}
.staff-price{font-weight:800;font-size:10pt}
.staff-slots{align-self:stretch;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.8mm;width:100%;align-content:center}
.offer-grid{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}
.offer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm}
.offer-icon{width:8mm;height:10mm;object-fit:contain}
.offer+ .offer{border-left:.3mm solid #d0d2ce}
.offer-label{font-size:9pt;font-weight:800;text-transform:uppercase}
.offer-price{font-size:24pt;font-weight:900}
.prospect{flex:1;display:flex;align-items:center;justify-content:center;gap:3mm}
.prospect img{width:12mm;height:12mm;object-fit:contain}
.prospect div{text-align:center}
.prospect-label{font-size:9pt;font-weight:800;text-transform:uppercase}
.prospect-price{font-size:24pt;font-weight:900;margin-top:1mm}
.section .section-head,.transport .section-head,.reagents .section-head,.rare-section .section-head{background:#fff;color:#263238}
.section .section-head img{filter:none}
.turn-order{flex-direction:row;align-items:stretch}.turn-order .section-head{height:auto;min-height:0;flex:0 0 45mm;justify-content:center;text-align:center}.turn-order-area{flex:1;min-width:0;margin:2mm;border:.35mm dashed #7d8982;border-radius:2mm;background:#fafbf9}
@page{size:A4 landscape;margin:5mm}
@media print{body{padding:0;background:white}.toolbar{display:none}.board{margin:0;width:287mm;height:200mm;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media screen and (max-width:1100px){body{overflow-x:auto}.board{margin-left:0;margin-right:0}}
</style>
</head>
<body>
<div class="toolbar"><h1>SYNCRODYSON · MERCADO</h1><button onclick="window.print()">Imprimir / guardar PDF</button></div>
<main class="board">
 <section class="section basics"><div class="section-head">Recursos básicos</div><div class="common-grid" id="basics"></div></section>
 <div class="middle">
  <section class="section rare-section"><div class="section-head"><img src="./iconos/RR-tierra-rara.svg" alt="">Tierras raras</div><div class="rare-grid" id="rares"></div></section>
  <section class="section transport"><div class="section-head"><img src="./iconos/Tr-transporte.svg" alt="">Transporte</div><div class="market-item"><div class="item-title"><img src="./iconos/Tr-transporte.svg" alt=""><span class="item-name"><span>Tr</span><small>Transporte</small></span></div><div class="price-list" id="transport-prices"></div></div></section>
  <section class="section reagents"><div class="section-head"><img src="./iconos/RQ-reactivos.svg" alt="">Reactivos</div><div class="rare-grid" id="reagents"></div></section>
 </div>
 <div class="lower">
  <section class="section"><div class="section-head"><img src="./iconos/RH-recursos-humanos.svg" alt="">Ingenieros</div><div class="staff-grid" id="staff"></div></section>
  <section class="section"><div class="section-head"><img class="project-head-icon" src="./iconos/CP-carta-proyecto.svg" alt="">Proyectos</div><div class="offer-grid"><div class="offer"><img class="offer-icon" src="./iconos/CP-carta-proyecto.svg" alt="CP"><span class="offer-label">Compra</span><span class="offer-price">$3</span></div><div class="offer"><img class="offer-icon" src="./iconos/CP-carta-proyecto.svg" alt="CP"><span class="offer-label">Venta</span><span class="offer-price">$2</span></div></div></section>
  <section class="section"><div class="section-head"><img src="./iconos/YA-yacimientos.svg" alt="">Yacimientos</div><div class="prospect"><img src="./iconos/YA-yacimientos.svg" alt=""><div><div class="prospect-label">Prospección</div><div class="prospect-price">$7</div></div></div></section>
 </div>
 <section class="section turn-order" aria-label="Espacio para las fichas de orden de turno"><div class="section-head">Orden de turno</div><div class="turn-order-area" aria-label="Fichas de orden disponibles"></div></section>
</main>
<script>
const common=[
 {id:'Fe',name:'Hierro',icon:'Fe-hierro.svg',prices:[2,1,1,1,1]},
 {id:'Cu',name:'Cobre',icon:null,prices:[5,4,3,2,2],color:'#3977dc'},
 {id:'Si',name:'Silicio',icon:null,prices:[3,3,2,2,1],color:'#f0d54d'},
 {id:'Ti',name:'Titanio',icon:null,prices:[9,8,6,5,3],color:'#58a85c'},
 {id:'Al',name:'Aluminio',icon:null,prices:[5,4,3,2,2],color:'#292929'},
 {id:'C',name:'Carbono',icon:null,prices:[2,1,1,1,1],color:'#fff'}
];
const rares=[
 {id:'Nd',name:'Neodimio',icon:null,prices:[14,12,9,7,5],color:'#e345ad'},
 {id:'Gd',name:'Gadolinio',icon:null,prices:[9,8,6,5,3],color:'#42c5c1'},
 {id:'Er',name:'Erbio',icon:null,prices:[9,8,6,5,3],color:'#ec933c'},
 {id:'Ce',name:'Cerio',icon:null,prices:[9,8,6,5,3],color:'#94623d'}
];
const engineers=[
 {id:'IE',name:'Estructural',file:'IE-ingeniero-estructural.svg',color:'#f0d54d'},
 {id:'IM',name:'Electromecánico',file:'IM-ingeniero-electromecanico.svg',color:'#df4444'},
 {id:'IQ',name:'Químico',file:'IQ-ingeniero-quimico.svg',color:'#58aa59'},
 {id:'IS',name:'Sistemas',file:'IS-ingeniero-sistemas.svg',color:'#4389d9'}
];
const reagents=[
 {id:'H₂SO₄',name:'Ácido sulfúrico',file:'RQ-reactivos.svg',prices:[5,4,3,2,2]},
 {id:'HCl',name:'Ácido clorhídrico',file:'RQ-reactivos.svg',prices:[5,4,3,2,2]}
];
function slots(count){return `<span class="slots" style="--slots:${count}">${Array.from({length:count},()=>'<i class="slot"></i>').join('')}</span>`}
function itemIcon(item){
 if(item.file)return `./iconos/${item.file}`;
 if(item.id==='Tr')return './iconos/Tr-transporte.svg';
 const colors={Cu:'#3977dc',Si:'#f0d54d',Ti:'#58a85c',Al:'#292929',C:'#fff',Nd:'#e345ad',Gd:'#42c5c1',Er:'#ec933c',Ce:'#94623d'};
 return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M7 14 27 5l8 9-8 15-21 5Z" fill="${colors[item.id]}" stroke="#222" stroke-width="2"/><path d="m7 14 20 3 8-3M27 17v12" fill="none" stroke="#222" stroke-width="2"/></svg>`)}`;
}
function priceRows(prices,count){return prices.map(price=>`<div class="price-row"><span class="price">$${price}</span>${slots(count)}</div>`).join('')}
function resource(item,count){return `<article class="market-item"><div class="item-title"><img src="${itemIcon(item)}" alt=""><span class="item-name"><span>${item.id}</span><small>${item.name}</small></span></div><div class="price-list">${priceRows(item.prices,count)}</div></article>`}
document.getElementById('basics').innerHTML=common.map(item=>resource(item,4)).join('');
document.getElementById('rares').innerHTML=rares.map(item=>resource(item,2)).join('');
document.getElementById('transport-prices').innerHTML=priceRows([11,9,7,5,4],3);
document.getElementById('reagents').innerHTML=reagents.map(item=>resource(item,2)).join('');
document.getElementById('staff').innerHTML=engineers.map(item=>`<div class="staff"><img src="./iconos/${item.file}" alt=""><span class="staff-name">${item.id}</span><span class="staff-price">$5</span></div>`).join('');
</script>
</body>
</html>
