<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syncrodyson · Objetivos</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f3f3f3;color:#202723;font-family:Arial,Helvetica,sans-serif}
.toolbar{max-width:173mm;margin:0 auto 16px;display:flex;align-items:center;flex-wrap:wrap;gap:12px}
button{padding:8px 12px;border:1px solid #333;background:white;cursor:pointer}
.toolbar small{font-size:12px;line-height:1.4}
.sheet{display:grid;grid-template-columns:repeat(4,41mm);gap:3mm;justify-content:center}
.card{width:41mm;height:63mm;padding:2.2mm;border:1px solid #222;border-radius:1.8mm;background:white;display:flex;flex-direction:column;gap:1.5mm;break-inside:avoid;page-break-inside:avoid}
.heading{min-height:6mm;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #888;padding-bottom:1mm}
h2{margin:0;font-size:9pt;line-height:1.1;text-align:center}
.objective{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;text-align:center}
.score{display:flex;align-items:center;justify-content:center;gap:1mm;font-size:16pt;font-weight:800;line-height:1}
.score img{width:6mm;height:6mm;object-fit:contain}
.description{margin:0;font-size:9pt;line-height:1.2}
.layer{display:flex;flex-direction:column;align-items:center;gap:1mm;font-size:10pt;font-weight:800;line-height:1.1}
.layer img{width:15mm;height:15mm;object-fit:contain}
.planet-symbol{width:26mm;height:26mm;object-fit:contain}
.planet-symbol{fill:none;stroke:#222;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card-foot{flex:none;display:flex;justify-content:space-between;font-size:5pt;letter-spacing:.06em;color:#59645f}
@page{size:A4 portrait;margin:8mm}
@media screen and (max-width:760px){.sheet{grid-template-columns:repeat(3,41mm)}}
@media screen and (max-width:510px){.sheet{grid-template-columns:repeat(2,41mm)}}
@media print{
 html,body{margin:0;padding:0;background:white}
 .toolbar{display:none}
 .sheet{grid-template-columns:repeat(4,41mm);gap:3mm}
 .card{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="toolbar"><button type="button" onclick="window.print()">Imprimir / guardar PDF</button><small>Objetivos · 41 × 63 mm, como los eventos.<br>8 cartas de planeta y 5 objetivos de capa · imprimir al 100 %.</small></header>
<main class="sheet" id="sheet" aria-label="Cartas de objetivo"></main>
<script src="./planetas.js"></script>
<script>
// Los ocho planetas presentes en los reclamos planetarios de eventos.html.
const planetasObjetivo=planetas;
const capasObjetivo=[
 {nombre:'Estructura',archivo:'ES-estructura.svg'},
 {nombre:'Fotovoltaica',archivo:'FV-fotovoltaico.svg'},
 {nombre:'Transmisión',archivo:'TS-transmision.svg'},
 {nombre:'Refrigeración',archivo:'RF-refrigeracion.svg'},
 {nombre:'Microondas',archivo:'MO-microondas.svg'}
];
document.getElementById('sheet').innerHTML=planetasObjetivo.map((planeta,i)=>{
 const id='O'+String(i+1).padStart(2,'0');
 return `<article class="card planet-card" aria-label="${id} · ${planeta.nombre}"><header class="heading"><h2>${planeta.nombre}</h2></header><div class="objective"><svg class="planet-symbol" viewBox="0 0 40 40" role="img" aria-label="Símbolo de ${planeta.nombre}">${planeta.simbolo}</svg></div><footer class="card-foot"><span>SYNCRODYSON</span><span>${id}</span></footer></article>`;
}).join('')+capasObjetivo.map((capa,i)=>{
 const id='O'+String(i+planetasObjetivo.length+1).padStart(2,'0');
 return `<article class="card layer-card" aria-label="${id} · Objetivo de ${capa.nombre}"><header class="heading"><h2>Objetivo de capa</h2></header><div class="objective"><div class="score"><span>+1</span><img src="./iconos/PV-punto-victoria.svg" alt="PV"></div><p class="description">por cada disco tuyo<br>en la capa</p><div class="layer"><img src="./iconos/${capa.archivo}" alt=""><span>${capa.nombre}</span></div></div><footer class="card-foot"><span>SYNCRODYSON</span><span>${id}</span></footer></article>`;
}).join('');
</script>
</body>
</html>
